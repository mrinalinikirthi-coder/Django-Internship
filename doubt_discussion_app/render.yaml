services:
  - type: web
    name: doubt-discussion-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn discussion_project.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: discussion_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DB_NAME
        value: discussion_db
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        value: your_password
      - key: DB_HOST
        value: localhost
      - key: DB_PORT
        value: 5432

databases:
  - name: discussion_db
    plan: free
    databaseName: discussion_db
    user: postgres